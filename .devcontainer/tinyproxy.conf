Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Error

# Required for HTTPS CONNECT tunneling
ConnectPort 443
ConnectPort 80

# Client IP gate — which containers may use this proxy
# Covers Docker's default bridge subnets; proxy is only reachable from the internal network anyway
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Destination domain gate — which hostnames the proxy will forward to
# Filter file is populated from hooks/allowed-domains.txt by proxy-entrypoint.sh
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterType fnmatch
